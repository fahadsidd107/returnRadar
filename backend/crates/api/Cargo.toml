[package]
name = "radar-api"
version.workspace = true
edition.workspace = true
[dependencies]
radar-domain = { path = "../domain" }
async-graphql = "7.2.1"
async-graphql-axum = "7.2.1"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
argon2 = "0.5"
sha2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
tower-http = { version = "0.6", features = ["cors"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "hostname"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rt-tokio", "rustls", "default-https-client"] }
aws-credential-types = "1"
prometheus = "0.14"
chrono-tz = "0.10"
