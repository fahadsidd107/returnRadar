name: return-radar
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: radar
    ports: ["127.0.0.1:55432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 3s
      timeout: 3s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.27.10
    ports: ["127.0.0.1:58025:8025", "127.0.0.1:51025:1025"]
  kafka-init:
    image: apache/kafka:4.0.1
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R 1000:1000 /var/lib/radar-kafka"]
    volumes: ["kafka:/var/lib/radar-kafka"]
  kafka:
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    image: apache/kafka:4.0.1
    ports: ["127.0.0.1:59092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:59092,INTERNAL://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    volumes: ["kafka:/tmp/kraft-combined-logs"]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:19092 >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 20
volumes:
  postgres:
  kafka:
